org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Reuse task outputs across builds (CI keeps the local cache in the Gradle User Home it caches).
org.gradle.caching=true
# AGP 9, KSP 2 and Kotlin 2.4 support the configuration cache. Problems only warn, so an
# incompatible plugin update degrades to a normal configuration rather than failing the build.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
