name: Release

# Push a tag such as v2.0.0 to build a signed APK + AAB and attach them to a GitHub release.
# Requires repository secrets: PAPER_SUDOKU_KEYSTORE_BASE64, PAPER_SUDOKU_STORE_PASSWORD,
# PAPER_SUDOKU_KEY_ALIAS, PAPER_SUDOKU_KEY_PASSWORD (see docs/release.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.PAPER_SUDOKU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::PAPER_SUDOKU_KEYSTORE_BASE64 is not set; see docs/release.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "PAPER_SUDOKU_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Test and build signed artifacts
        env:
          PAPER_SUDOKU_STORE_PASSWORD: ${{ secrets.PAPER_SUDOKU_STORE_PASSWORD }}
          PAPER_SUDOKU_KEY_ALIAS: ${{ secrets.PAPER_SUDOKU_KEY_ALIAS }}
          PAPER_SUDOKU_KEY_PASSWORD: ${{ secrets.PAPER_SUDOKU_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :core:engine:test :core:game:test :app:testDebugUnitTest :app:lintDebug \
            :app:assembleRelease :app:bundleRelease

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "paper-sudoku-$version.apk"
          cp app/build/outputs/bundle/release/app-release.aab "paper-sudoku-$version.aab"
          gh release create "$GITHUB_REF_NAME" "paper-sudoku-$version.apk" "paper-sudoku-$version.aab" \
            --title "Paper Sudoku $version" --notes-file CHANGELOG.md
