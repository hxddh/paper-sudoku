name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run unit tests
        run: ./gradlew --no-daemon :core:engine:test :core:game:test :app:testDebugUnitTest

      - name: Build debug APKs and release APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :benchmark:assembleBenchmark -PpaperSudoku.sideload=true

      # The committed Baseline Profile must survive R8 and land in the APK for profileinstaller.
      # The app promises no network and nothing in the background beyond the widget: the merged
      # manifest (libraries included) must ask for exactly tools/ci/permissions.allowed. The APK
      # must stay within its byte budget (tools/ci/speed-budget.json).
      - name: Permissions, Baseline Profile and APK size
        run: sh tools/ci/check-apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Run lint
        run: ./gradlew --no-daemon :app:lintDebug

      # Warnings don't fail the build: count them per rule and list each one (file:line: rule:
      # message) in the log, errors included when lint failed.
      - name: Lint findings
        if: always()
        run: python3 tools/ci/lint-summary.py app/build/reports/lint-results-debug.sarif

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-sudoku-lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-sudoku-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-sudoku-unit-test-reports
          path: |
            core/*/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      # Room exports its schema at build time; a schema change must be committed with the
      # migration that handles it.
      - name: Room schema is committed
        run: |
          for f in app/schemas/*/*.json; do echo "== $f"; cat "$f"; done
          git status --porcelain app/schemas
          test -z "$(git status --porcelain app/schemas)"

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    # Read-only: the captures are pushed by publish-captures below, which runs none of this code.
    # actions: read fetches main's benchmark traces to compare against.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Run Compose UI and accessibility tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            ./gradlew --no-daemon :app:assembleDebug
            mkdir -p app/build/outputs
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure navigation_mode 2 || true
            adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.gestural || true
            adb shell am start -W -n com.titpea.papersudoku/.MainActivity
            sleep 5
            # The headless emulator's launcher can show a Quickstep ANR over the app: tap its
            # Wait button if (and only if) one is on screen.
            sh tools/ci/dismiss-anr.sh
            sleep 2
            adb exec-out screencap -p > app/build/outputs/paper-sudoku-default.png
            # Night and landscape captures for visual review (uploaded below).
            adb shell cmd uimode night yes; sleep 4
            adb exec-out screencap -p > app/build/outputs/paper-sudoku-night.png
            adb shell cmd uimode night no
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1; sleep 5
            adb exec-out screencap -p > app/build/outputs/paper-sudoku-landscape.png
            adb shell settings put system user_rotation 0; sleep 2
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch app/build/ui-tests-failed
            adb pull /sdcard/Android/data/com.titpea.papersudoku/files/screenshots app/build/outputs/screenshots || true
            # The UI tests run without animations; the benchmark (and the minified SmokeTest) must
            # measure the ink and stamp animations users see, so turn them back on.
            adb shell settings put global window_animation_scale 1
            adb shell settings put global transition_animation_scale 1
            adb shell settings put global animator_duration_scale 1
            ./gradlew --no-daemon :benchmark:connectedBenchmarkAndroidTest || touch app/build/benchmark-failed
            # Keep the Macrobenchmark results (the profile run below writes to the same outputs)
            # and hold them to tools/ci/speed-budget.json: above 1.25 x a budget fails the job.
            mkdir -p app/build/outputs/benchmark
            cp -r benchmark/build/outputs/. app/build/outputs/benchmark/ || true
            python3 tools/ci/speed-budget.py app/build/outputs/benchmark || touch app/build/over-budget
            # Record the Baseline Profile of the real journey on this emulator. The release ships
            # the committed app/src/main/baseline-prof.txt; this prints what the journey ran
            # outside it, to extend it from (the generated file is uploaded below).
            sh tools/ci/record-profile.sh
            test ! -e app/build/ui-tests-failed && test ! -e app/build/benchmark-failed && test ! -e app/build/over-budget

      # Gradle only links the report; name each failed test and its message in the log.
      - name: Failed device tests
        if: failure()
        run: |
          # Result files are named after the device ("TEST-test(AVD) - 16-_app-.xml"): read whole lines.
          find app/build/outputs/androidTest-results benchmark/build/outputs/androidTest-results -name "*.xml" 2>/dev/null | while IFS= read -r f; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).iter("testcase"):
              for failure in list(case.findall("failure")) + list(case.findall("error")):
                  print(f"FAILED {case.get('classname')}#{case.get('name')}")
                  print("\n".join((failure.text or failure.get("message") or "").splitlines()[:25]))
          PY
          done

      # The screenshot matrix renders fixed pages; any visual change must update the goldens.
      - name: Compare screenshots with goldens
        # Also when a later device step (the benchmark) failed: the captures are already pulled.
        if: always()
        run: |
          pip install --quiet pillow
          python3 tools/compare_screenshots.py app/build/outputs/screenshots app/src/androidTest/screenshots

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-sudoku-instrumentation
          path: app/build/reports/androidTests/

      # Also what publish-captures pushes: the live-app captures (paper-sudoku-*.png) and
      # screenshots/ with the matrix, its reduced copies (screenshots/reduced, written by
      # compare_screenshots.py) and the store shots (screenshots/store).
      - name: Upload device screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-sudoku-screenshots
          path: |
            app/build/outputs/paper-sudoku-*.png
            app/build/outputs/screenshots/

      - name: Benchmark results
        if: always()
        run: |
          python3 tools/ci/benchmark-summary.py app/build/outputs/benchmark || true
          python3 tools/ci/speed-budget.py app/build/outputs/benchmark || true
          find app/build/outputs/benchmark -name "*benchmarkData.json" -exec cat {} \; || true
          find benchmark/build/outputs/androidTest-results -name "*.xml" -exec cat {} \; || true

      # Where start-up and writing spend their time, against main's last green run: main-thread
      # slices and states, app threads' CPU and what else ran on the device (medians, in ms).
      - name: Where the time goes (Perfetto traces against main)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet perfetto
          mkdir -p base-traces
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow android.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run" ]; then gh run download "$run" -R "$GITHUB_REPOSITORY" -n paper-sudoku-benchmark -D base-traces || echo "No benchmark results on main's run $run"; fi
          python3 tools/ci/trace-compare.py base-traces app/build/outputs/benchmark

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-sudoku-benchmark
          path: |
            app/build/outputs/benchmark/
            app/build/outputs/generated-*-prof.txt
            benchmark/build/outputs/

  # The reduced captures (the goldens' format), the live-app captures and the store shots go to a
  # throwaway branch per PR (captures/pr-<number>: goldens/, app/, store/), so a reviewer can fetch
  # them with git, look, and commit them as goldens. This job only downloads the screenshots
  # artifact: no checkout of the PR's code and no Gradle, so the write token never meets them.
  publish-captures:
    needs: instrumentation
    # Also when the device tests failed: the captures show why. Not for forks (read-only token).
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to push the captures branch

    steps:
      - name: Fetch the device screenshots
        # The emulator job may have stopped before uploading any; the next step says so.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paper-sudoku-screenshots
          path: captures

      - name: Publish captures for review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: captures/pr-${{ github.event.pull_request.number }}
        run: |
          # The artifact holds app/build/outputs/{paper-sudoku-*.png,screenshots/}; with no
          # live-app captures it is rooted at screenshots/ itself.
          root="$GITHUB_WORKSPACE/captures"
          shots="$root/screenshots"
          [ -d "$shots" ] || shots="$root"
          src="$shots/reduced"
          [ -d "$src" ] || { echo "No captures"; exit 0; }
          out=$(mktemp -d)
          mkdir -p "$out/goldens" "$out/app" "$out/store"
          cp "$src"/*.png "$out/goldens/"
          cp "$root"/paper-sudoku-*.png "$out/app/" 2>/dev/null || true
          # The Play listing's screenshots (artwork, not compared with goldens).
          cp "$shots"/store/*.png "$out/store/" 2>/dev/null || true
          cd "$out"
          git init -q -b "$BRANCH"
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Captures for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "Published to $BRANCH"
