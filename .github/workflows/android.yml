name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew --no-daemon :core:engine:test :app:testDebugUnitTest

      - name: Build debug APKs and release APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Run lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: paper-sudoku-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Run Compose UI and accessibility tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            mkdir -p app/build/outputs
            adb shell am start -W -n com.titpea.papersudoku/.MainActivity
            sleep 5
            adb exec-out screencap -p > app/build/outputs/paper-sudoku-default.png

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-sudoku-instrumentation
          path: app/build/reports/androidTests/

      - name: Upload device screenshot
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: paper-sudoku-screenshot
          path: app/build/outputs/paper-sudoku-default.png
