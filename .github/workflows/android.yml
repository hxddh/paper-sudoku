name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run unit tests
        run: ./gradlew --no-daemon :core:engine:test :core:game:test :app:testDebugUnitTest

      - name: Build debug APKs and release APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :benchmark:assembleBenchmark -PpaperSudoku.sideload=true

      # The hand-written Baseline Profile must survive R8 and land in the APK for profileinstaller.
      - name: Baseline Profile is packaged
        run: unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "assets/dexopt/baseline\.prof$"

      # The app promises no network: the merged manifest (libraries included) must agree.
      - name: No network permissions
        run: |
          perms=$("$ANDROID_HOME/build-tools/37.0.0/aapt2" dump permissions app/build/outputs/apk/release/app-release.apk)
          echo "$perms"
          if echo "$perms" | grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE)"; then
            echo "::error::The release APK requests a network permission"
            exit 1
          fi

      - name: Run lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: paper-sudoku-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paper-sudoku-unit-test-reports
          path: |
            core/*/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      # Room exports its schema at build time; a schema change must be committed with the
      # migration that handles it.
      - name: Room schema is committed
        run: |
          for f in app/schemas/*/*.json; do echo "== $f"; cat "$f"; done
          git status --porcelain app/schemas
          test -z "$(git status --porcelain app/schemas)"

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: write # only to publish the captures branch below

    steps:
      # The write token stays out of .git/config: only the publish step below receives it, so
      # nothing the emulator step runs (Gradle scripts, third-party actions) can push.
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Run Compose UI and accessibility tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            ./gradlew --no-daemon :app:assembleDebug
            mkdir -p app/build/outputs
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure navigation_mode 2 || true
            adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.gestural || true
            adb shell am start -W -n com.titpea.papersudoku/.MainActivity
            sleep 5
            # The headless emulator's launcher can show a Quickstep ANR over the app: tap its
            # Wait button if (and only if) one is on screen.
            sh tools/ci/dismiss-anr.sh
            sleep 2
            adb exec-out screencap -p > app/build/outputs/paper-sudoku-default.png
            # Night and landscape captures for visual review (uploaded below).
            adb shell cmd uimode night yes; sleep 4
            adb exec-out screencap -p > app/build/outputs/paper-sudoku-night.png
            adb shell cmd uimode night no
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1; sleep 5
            adb exec-out screencap -p > app/build/outputs/paper-sudoku-landscape.png
            adb shell settings put system user_rotation 0; sleep 2
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            adb pull /sdcard/Android/data/com.titpea.papersudoku/files/screenshots app/build/outputs/screenshots || true
            ./gradlew --no-daemon :benchmark:connectedBenchmarkAndroidTest

      # The screenshot matrix renders fixed pages; any visual change must update the goldens.
      - name: Compare screenshots with goldens
        # Also when a later device step (the benchmark) failed: the captures are already pulled.
        if: always()
        run: |
          pip install --quiet pillow
          python3 tools/compare_screenshots.py app/build/outputs/screenshots app/src/androidTest/screenshots

      # The reduced captures (the goldens' format) and the live-app captures go to a throwaway
      # branch per PR, so a reviewer can fetch them with git, look, and commit them as goldens.
      - name: Publish captures for review
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: captures/pr-${{ github.event.pull_request.number }}
        run: |
          src=app/build/outputs/screenshots/reduced
          [ -d "$src" ] || { echo "No captures"; exit 0; }
          out=$(mktemp -d)
          mkdir -p "$out/goldens" "$out/app"
          cp "$src"/*.png "$out/goldens/"
          cp app/build/outputs/paper-sudoku-*.png "$out/app/" 2>/dev/null || true
          cd "$out"
          git init -q -b "$BRANCH"
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Captures for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "Published to $BRANCH"

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-sudoku-instrumentation
          path: app/build/reports/androidTests/

      - name: Upload device screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-sudoku-screenshots
          path: |
            app/build/outputs/paper-sudoku-*.png
            app/build/outputs/screenshots/

      - name: Benchmark results
        if: always()
        run: |
          find benchmark/build/outputs -name "*benchmarkData.json" -exec cat {} \; || true
          find benchmark/build/outputs/androidTest-results -name "*.xml" -exec cat {} \; || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-sudoku-benchmark
          path: benchmark/build/outputs/
