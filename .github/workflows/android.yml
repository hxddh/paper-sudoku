name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run unit tests
        run: ./gradlew --no-daemon :core:engine:test :core:game:test :app:testDebugUnitTest

      - name: Build debug APKs and release APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Run lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: paper-sudoku-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paper-sudoku-unit-test-reports
          path: |
            core/*/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      # Room exports its schema at build time; a schema change must be committed with the
      # migration that handles it.
      - name: Room schema is committed
        run: |
          for f in app/schemas/*/*.json; do echo "== $f"; cat "$f"; done
          git status --porcelain app/schemas
          test -z "$(git status --porcelain app/schemas)"

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Run Compose UI and accessibility tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            ./gradlew --no-daemon :app:assembleDebug
            mkdir -p app/build/outputs
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure navigation_mode 2 || true
            adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.gestural || true
            adb shell killall com.android.systemui || true
            sleep 2
            adb shell am start -W -n com.titpea.papersudoku/.MainActivity
            sleep 8
            # The headless emulator's launcher can show a Quickstep ANR over the app.
            # Pixel 6 places its Wait action here; a no-op if no dialog is present.
            adb shell input tap 400 1320 || true
            sleep 3
            adb exec-out screencap -p > app/build/outputs/paper-sudoku-default.png
            # TEMP(review): small previews in the log for remote visual review.
            adb shell cmd uimode night yes; sleep 4
            adb exec-out screencap -p > app/build/outputs/paper-sudoku-night.png
            adb shell cmd uimode night no
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1; sleep 5
            adb exec-out screencap -p > app/build/outputs/paper-sudoku-landscape.png
            adb shell settings put system user_rotation 0; sleep 2
            for f in default night landscape; do
              convert "app/build/outputs/paper-sudoku-$f.png" -resize 420x420 -quality 55 "/tmp/$f.jpg"
              echo "PREVIEW-$f-BEGIN"; base64 -w0 "/tmp/$f.jpg"; echo; echo "PREVIEW-$f-END"
            done
            ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-sudoku-instrumentation
          path: app/build/reports/androidTests/

      - name: Upload device screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-sudoku-screenshot
          path: app/build/outputs/paper-sudoku-*.png
